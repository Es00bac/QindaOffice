<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:,">
  <title>QindaOffice · Validation captures</title>
  <style>
    :root { font: 14px/1.4 Inter, system-ui, sans-serif; color: #dce7eb; background: #0d151a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .topbar { position: sticky; top: 0; z-index: 5; padding: 16px clamp(16px, 3vw, 40px);
      background: #111d23ee; border-bottom: 1px solid #2b4049; backdrop-filter: blur(16px); }
    .topline { display: flex; align-items: start; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
    .eyebrow { margin: 0 0 3px; color: #68d7e3; font-size: 11px; font-weight: 700;
      letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(23px, 2.7vw, 34px); letter-spacing: -.035em; }
    .subtitle { margin: 5px 0 0; color: #96aeb8; max-width: 70ch; }
    .status { display: flex; align-items: center; gap: 8px; margin-top: 5px; color: #a9c2ca;
      font-size: 12px; white-space: nowrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #47d5ac;
      box-shadow: 0 0 0 4px #47d5ac22; }
    .dot.offline { background: #ec837d; box-shadow: 0 0 0 4px #ec837d22; }
    .toolbar { display: flex; align-items: center; gap: 12px; margin-top: 17px; flex-wrap: wrap; }
    .search { flex: 1; min-width: min(280px, 100%); max-width: 560px; height: 38px;
      padding: 0 12px; border: 1px solid #36505a; border-radius: 7px;
      color: #e9f7f8; background: #17262d; outline: none; }
    .search:focus { border-color: #68d7e3; box-shadow: 0 0 0 3px #68d7e322; }
    .toggle { display: inline-flex; align-items: center; gap: 8px; color: #bed0d5; user-select: none; }
    .toggle input { accent-color: #68d7e3; width: 16px; height: 16px; }
    .count { color: #8eaab3; font-variant-numeric: tabular-nums; }
    main { max-width: 1800px; margin: 0 auto; padding: 26px clamp(16px, 3vw, 40px) 80px; }
    .day { margin: 0 0 34px; }
    .dayhead { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; }
    .dayhead h2 { margin: 0; font-size: 15px; color: #a9bec6; font-weight: 650; }
    .dayhead::after { content: ""; height: 1px; background: #2a3e46; flex: 1; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 16px; }
    .card { min-width: 0; border: 1px solid #2e434b; border-radius: 9px;
      background: #16232a; overflow: hidden; text-align: left; color: inherit; padding: 0;
      transition: border-color .15s, transform .15s; content-visibility: auto; }
    .card:hover, .card:focus-visible { border-color: #6ad7e2; transform: translateY(-2px); outline: none; }
    .thumb { display: flex; align-items: center; justify-content: center; height: 190px;
      background: #0b1317; border-bottom: 1px solid #2b4049; }
    .thumb img { width: 100%; height: 100%; object-fit: contain; }
    .meta { display: grid; gap: 5px; padding: 12px 13px 13px; }
    .name { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .source { color: #93adb6; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .time { color: #6dd3dd; font-size: 11px; font-variant-numeric: tabular-nums; }
    .empty { padding: 72px 15px; text-align: center; color: #93adb6; border: 1px dashed #3a525c;
      border-radius: 10px; }
    .viewer[hidden] { display: none; }
    .viewer { position: fixed; inset: 0; z-index: 10; display: grid; grid-template-rows: auto 1fr auto;
      background: #060c0fef; backdrop-filter: blur(18px); }
    .viewerbar { display: flex; align-items: center; gap: 12px; padding: 13px 18px;
      border-bottom: 1px solid #31454d; }
    .viewerbar .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; font-weight: 650; }
    .viewer button { border: 1px solid #47616b; background: #1b3038; color: #e3f1f4;
      border-radius: 6px; min-width: 38px; min-height: 36px; }
    .viewer button:hover, .viewer a:hover { border-color: #68d7e3; }
    .viewer a { color: #8fe4eb; border: 1px solid #47616b; border-radius: 6px;
      padding: 8px 12px; text-decoration: none; white-space: nowrap; }
    .viewerbody { display: flex; align-items: center; justify-content: center; min-height: 0; padding: 16px; }
    .viewerbody img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .viewerfoot { padding: 10px 18px; color: #9eb8c1; border-top: 1px solid #31454d;
      font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (max-width: 640px) {
      .topbar { position: relative; }
      .viewerbar { flex-wrap: wrap; }
      .viewerbar .title { flex-basis: 100%; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topline">
      <div>
        <p class="eyebrow">Development validation</p>
        <h1>QindaOffice captures</h1>
        <p class="subtitle">Ribbon, toolkit adoption and QindaMail (M40–M44): every screenshot from the suite, its worktrees and its QindaTK lanes, in capture order. New images appear automatically.</p>
      </div>
      <div class="status" aria-live="polite"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div>
    </div>
    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="Filter by filename or worktree" aria-label="Filter screenshots">
      <label class="toggle"><input id="follow" type="checkbox" checked> Follow latest</label>
      <span class="count" id="count"></span>
    </div>
  </header>
  <main id="gallery" aria-live="polite"></main>
  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Screenshot viewer" hidden>
    <div class="viewerbar">
      <span class="title" id="viewerTitle"></span>
      <button id="previous" aria-label="Previous screenshot">←</button>
      <button id="next" aria-label="Next screenshot">→</button>
      <a id="original" target="_blank" rel="noopener">Open original</a>
      <button id="close" aria-label="Close screenshot">×</button>
    </div>
    <div class="viewerbody"><img id="viewerImage" alt=""></div>
    <div class="viewerfoot" id="viewerFoot"></div>
  </div>
  <script>
    // SPDX-License-Identifier: LGPL-3.0-or-later
    const gallery = document.getElementById('gallery');
    const status = document.getElementById('status');
    const dot = document.getElementById('dot');
    const count = document.getElementById('count');
    const search = document.getElementById('search');
    const follow = document.getElementById('follow');
    const viewer = document.getElementById('viewer');
    let items = [];
    let visible = [];
    let version = -1;
    let current = -1;
    let firstLoad = true;
    const dateFormat = new Intl.DateTimeFormat(undefined, {dateStyle: 'full'});
    const timeFormat = new Intl.DateTimeFormat(undefined, {dateStyle: 'medium', timeStyle: 'short'});
    const imageUrl = item => `/image/${item.id}`;
    const captureDate = item => new Date(item.capturedNs / 1e6);

    function render() {
      const query = search.value.trim().toLocaleLowerCase();
      visible = items.filter(item => `${item.name} ${item.source}`.toLocaleLowerCase().includes(query));
      count.textContent = `${visible.length.toLocaleString()} of ${items.length.toLocaleString()} captures`;
      gallery.replaceChildren();
      if (!visible.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = items.length ? 'No captures match this filter.' : 'Waiting for screenshots from QindaOffice and its QindaTK lanes…';
        gallery.append(empty);
        return;
      }
      let group = null;
      let grid = null;
      for (let index = 0; index < visible.length; index++) {
        const item = visible[index];
        const day = captureDate(item).toDateString();
        if (day !== group) {
          group = day;
          const section = document.createElement('section');
          section.className = 'day';
          const head = document.createElement('div');
          head.className = 'dayhead';
          const heading = document.createElement('h2');
          heading.textContent = dateFormat.format(captureDate(item));
          head.append(heading);
          grid = document.createElement('div');
          grid.className = 'grid';
          section.append(head, grid);
          gallery.append(section);
        }
        const card = document.createElement('button');
        card.className = 'card';
        card.type = 'button';
        card.setAttribute('aria-label', `${item.name}, ${timeFormat.format(captureDate(item))}`);
        const thumb = document.createElement('div');
        thumb.className = 'thumb';
        const image = document.createElement('img');
        image.src = imageUrl(item);
        image.alt = '';
        image.loading = 'lazy';
        thumb.append(image);
        const meta = document.createElement('div');
        meta.className = 'meta';
        for (const [className, text] of [
          ['name', item.name], ['source', item.source], ['time', timeFormat.format(captureDate(item))]
        ]) {
          const line = document.createElement('span');
          line.className = className;
          line.textContent = text;
          line.title = text;
          meta.append(line);
        }
        card.append(thumb, meta);
        card.addEventListener('click', () => openViewer(index));
        grid.append(card);
      }
      if (follow.checked) requestAnimationFrame(() => window.scrollTo({top: document.documentElement.scrollHeight, behavior: firstLoad ? 'instant' : 'smooth'}));
      firstLoad = false;
    }

    function openViewer(index) {
      current = index;
      const item = visible[current];
      if (!item) return;
      document.getElementById('viewerTitle').textContent = item.name;
      const image = document.getElementById('viewerImage');
      image.src = imageUrl(item);
      image.alt = item.name;
      document.getElementById('viewerFoot').textContent = `${timeFormat.format(captureDate(item))} · ${item.source}`;
      document.getElementById('original').href = imageUrl(item);
      viewer.hidden = false;
      document.getElementById('close').focus();
    }
    function closeViewer() { viewer.hidden = true; current = -1; }
    function moveViewer(delta) {
      if (current < 0 || !visible.length) return;
      openViewer((current + delta + visible.length) % visible.length);
    }
    document.getElementById('close').addEventListener('click', closeViewer);
    document.getElementById('previous').addEventListener('click', () => moveViewer(-1));
    document.getElementById('next').addEventListener('click', () => moveViewer(1));
    viewer.addEventListener('click', event => { if (event.target === viewer) closeViewer(); });
    document.addEventListener('keydown', event => {
      if (viewer.hidden) return;
      if (event.key === 'Escape') closeViewer();
      else if (event.key === 'ArrowLeft') moveViewer(-1);
      else if (event.key === 'ArrowRight') moveViewer(1);
    });
    search.addEventListener('input', render);
    follow.addEventListener('change', () => { if (follow.checked) window.scrollTo({top: document.documentElement.scrollHeight, behavior: 'smooth'}); });

    async function refresh() {
      try {
        const response = await fetch('/api/screenshots', {cache: 'no-store'});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        status.textContent = `Live · ${data.roots.length} worktrees`;
        dot.classList.remove('offline');
        if (data.version !== version) {
          version = data.version;
          items = data.items;
          render();
        }
      } catch (error) {
        status.textContent = `Disconnected · ${error.message}`;
        dot.classList.add('offline');
      }
    }
    refresh();
    setInterval(refresh, 2500);
  </script>
</body>
</html>
